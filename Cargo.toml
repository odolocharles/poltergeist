[workspace]
resolver = "2"
members = ["core", "backends", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
rand = "0.8"
thiserror = "1"
poltergeist-core = { path = "core" }
poltergeist-backends = { path = "backends" }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
