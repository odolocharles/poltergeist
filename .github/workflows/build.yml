name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (installer .run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p poltergeist-core
      - run: cargo build --release -p poltergeist-gtk -p poltergeist-cli
      - name: Build the installer
        run: ./packaging/linux/make-run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-linux
          path: poltergeist-linux-x86_64.run

  windows:
    name: Windows (setup .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p poltergeist-core
      - run: cargo build --release -p poltergeist-app -p poltergeist-cli
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging/windows/poltergeist.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-windows
          path: dist/Poltergeist-Setup.exe

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p poltergeist-app -p poltergeist-cli --target aarch64-apple-darwin
      - run: cargo build --release -p poltergeist-app -p poltergeist-cli --target x86_64-apple-darwin
      - run: ./packaging/macos/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-macos
          path: Poltergeist.dmg

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Point the build at the runner's Android NDK
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - run: cargo install cargo-apk2 --locked
      - name: Create a signing key for this build
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/poltergeist.keystore" \
            -storepass android -keypass android -alias poltergeist \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Poltergeist"
      - name: Build APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/poltergeist.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: cargo apk2 build --release -p poltergeist-app --lib --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-android
          path: target/release/apk/poltergeist.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Optional: publish to a separate public repo (see DEVELOPING.md).
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
